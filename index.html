<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="Talk Timer">
<meta name="description" content="Talk timer with phase colors and overtime tracking.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Talk Timer</title>
<style>
:root{--accent:#E879F9;--bg:#150A1B;--card:#241129;--text:#FBEFFF;--dim:#A98BB3;
  --green:#4ADE80;--yellow:#FACC15;--red:#F87171;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--text);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100dvh}
.app{width:min(480px,100vw - 24px);height:100dvh;max-height:780px;display:flex;flex-direction:column;padding:16px 14px 12px}
header{text-align:center;margin-bottom:8px}
header h1{font-size:22px;letter-spacing:.06em;color:var(--accent)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.stepper button{width:72px;min-height:56px;font-size:28px;border-radius:14px;
  background:var(--card);color:var(--accent);border:1px solid #4A2450;cursor:pointer;font-weight:800}
.stepper .val{font-size:22px;font-weight:700;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.display{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border:1px solid #4A2450;border-radius:18px;min-height:0;margin-bottom:10px}
#clock{font-size:76px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#phase{font-size:14px;color:var(--dim);margin-top:6px;letter-spacing:.08em}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.controls button{min-height:64px;font-size:18px;font-weight:800;border-radius:16px;cursor:pointer;border:none}
#startbtn{background:var(--accent);color:#150A1B}
#resetbtn{background:#3A2330;color:#FFB4C8;border:1px solid #5A3344}
button[data-focusable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header><h1>TALK TIMER</h1></header>
  <div class="stepper">
    <button id="minus" data-focusable aria-label="Decrease minutes">&minus;</button>
    <div class="val"><span id="minval">10</span> min</div>
    <button id="plus" data-focusable aria-label="Increase minutes">+</button>
  </div>
  <div class="display">
    <div id="clock">10:00</div>
    <div id="phase">READY</div>
  </div>
  <div class="controls">
    <button id="startbtn" data-focusable>Start</button>
    <button id="resetbtn" data-focusable>Reset</button>
  </div>
</div>
<script>
(function(){
"use strict";
var MIN_MIN=1,MAX_MIN=60;
var totalMin=10,running=false,overtime=false,beeped=false;
var endAt=0,remainMs=totalMin*60000,timerId=null;
var clockEl=document.getElementById("clock"),phaseEl=document.getElementById("phase"),
    minEl=document.getElementById("minval"),startBtn=document.getElementById("startbtn");
function fmt(ms){
  var s=Math.floor(Math.abs(ms)/1000);
  var mm=Math.floor(s/60),ss=s%60;
  return (ms<0?"+":"")+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}
function phase(remaining,total){
  var r=remaining/total;
  if(r>=1/3)return "green";
  if(r>=0.1)return "yellow";
  return "red";
}
var COLORS={green:"#4ADE80",yellow:"#FACC15",red:"#F87171"};
function render(ms){
  if(ms===undefined)ms=remainMs;
  if(overtime){
    clockEl.textContent=fmt(-ms);
    clockEl.style.color=COLORS.red;
    phaseEl.textContent="OVERTIME";
  }else{
    clockEl.textContent=fmt(ms);
    var p=phase(ms,totalMin*60000);
    clockEl.style.color=COLORS[p];
    phaseEl.textContent=p.toUpperCase()+" \u00b7 "+Math.ceil(ms/60000)+" min left";
  }
  minEl.textContent=totalMin;
}
function beep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    var c=new AC(),o=c.createOscillator(),g=c.createGain();
    o.type="sine";o.frequency.value=880;
    g.gain.setValueAtTime(0.001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.5,c.currentTime+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.8);
    o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+0.85);
  }catch(e){}
}
function tick(){
  var now=Date.now();
  var ms=endAt-now;
  if(ms<=0){
    overtime=true;
    if(!beeped){beeped=true;beep();}
    render(ms);
  }else{
    render(ms);
  }
}
function start(){
  if(running){return;}
  running=true;overtime=false;
  startBtn.textContent="Pause";
  if(remainMs<=0)remainMs=totalMin*60000;
  endAt=Date.now()+remainMs;
  timerId=setInterval(tick,250);
  tick();
}
function pause(){
  running=false;
  clearInterval(timerId);timerId=null;
  startBtn.textContent="Start";
  remainMs=Math.max(0,endAt-Date.now());
  render(remainMs);
}
function reset(){
  if(running){clearInterval(timerId);timerId=null;running=false;}
  overtime=false;beeped=false;remainMs=totalMin*60000;
  startBtn.textContent="Start";
  render(remainMs);
}
document.getElementById("minus").addEventListener("click",function(){
  if(running)return;
  totalMin=Math.max(MIN_MIN,totalMin-1);remainMs=totalMin*60000;render(remainMs);
});
document.getElementById("plus").addEventListener("click",function(){
  if(running)return;
  totalMin=Math.min(MAX_MIN,totalMin+1);remainMs=totalMin*60000;render(remainMs);
});
startBtn.addEventListener("click",function(){running?pause():start();});
document.getElementById("resetbtn").addEventListener("click",reset);
var order=["minus","plus","startbtn","resetbtn"].map(function(id){return document.getElementById(id);});
document.addEventListener("keydown",function(e){
  var i=order.indexOf(document.activeElement);
  if(e.key==="Enter"&&i>=0){e.preventDefault();order[i].click();return;}
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();order[(i+1+order.length)%order.length].focus();}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();order[(i-1+order.length)%order.length].focus();}
});
render(remainMs);
order[2].focus();
})();
</script>
</body>
</html>
